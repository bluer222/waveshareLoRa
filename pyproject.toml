[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveshare-lora"
version = "0.1.0"
description = "Async Python library for JSON over Waveshare USB-TO-LoRa-xF (SX1262)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lora", "sx1262", "waveshare", "usb", "asyncio", "json"]
dependencies = [
  "pyserial>=3.5",
  "pyserial-asyncio>=0.6",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
